<!doctype html>
<html lang="en" manifest="cache.appcache">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Shadow's Services</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        min-height: 100%;
        background: #0b0d10;
        color: #c8ced8;
        font:
          15px/1.45 "Segoe UI",
          system-ui,
          sans-serif;
      }
      #brand {
        text-align: center;
        padding: 8px 10px;
        background: #0e1116;
        border-bottom: 1px solid #1e2732;
      }
      #brand img {
        width: 28px;
        height: 28px;
        margin-right: 8px;
        border-radius: 50%;
        vertical-align: middle;
      }
      #brand b {
        font-size: 15px;
        font-weight: 700;
        letter-spacing: 0.14em;
        color: #e6ebf2;
        vertical-align: middle;
      }

      /* running: a spinner under the brand. jb.js sets body.done / body.fail / body.log. */
      #spin {
        position: fixed;
        top: calc(50% + 20px);
        left: 50%;
        width: 46px;
        height: 46px;
        margin: -23px 0 0 -23px;
        border: 4px solid #1e2732;
        border-top-color: #7fd0a0;
        border-radius: 50%;
        animation: spin 0.9s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      #msg {
        position: fixed;
        top: 50%;
        left: 0;
        right: 0;
        transform: translateY(-50%);
        text-align: center;
        font-size: 16px;
        letter-spacing: 0.5px;
        display: none;
      }
      #wrap {
        padding: 0;
      }
      #state,
      #out {
        display: none;
      }

      body.done #spin {
        display: none;
      }
      body.fail #spin {
        display: none;
      }
      body.fail #msg {
        display: block;
      }

      /* ?log=1 -- the full step log, styled like the landing. */
      body.log #spin,
      body.log #msg {
        display: none;
      }
      body.log #wrap {
        padding: 14px 18px;
      }
      body.log #state {
        display: block;
        font-size: 22px;
        font-weight: 700;
        margin: 0 0 8px;
      }
      body.log #out {
        display: block;
        white-space: pre-wrap;
        font:
          12px/1.45 Consolas,
          monospace;
        background: #11151b;
        border: 1px solid #1e2732;
        border-radius: 5px;
        padding: 10px 12px;
        height: calc(100vh - 141px);
        overflow-y: auto;
      }
      .ok {
        color: #7fd0a0;
      }
      .bad {
        color: #d08a7f;
      }
      .warn {
        color: #d8c07f;
      }
      .safe {
        color: #7fd0a0;
      }
      .danger {
        color: #d08a7f;
      }
      code {
        color: #9fb3d0;
      }
      #warn {
        padding: 14px 12px;
        background: #3a0f10;
        color: #ffdede;
        border-bottom: 2px solid #a5202a;
        text-align: center;
        font-weight: 900;
        font-size: 17px;
        letter-spacing: 0.08em;
        line-height: 1.35;
        text-transform: uppercase;
        text-shadow: 0 0 6px rgba(255, 60, 60, 0.45);
        animation: warnpulse 1.6s ease-in-out infinite;
      }
      #warn b { color: #ff5666; font-size: 19px; }
      @keyframes warnpulse {
        0%, 100% { background: #3a0f10; }
        50%      { background: #5a1418; }
      }
      #foot {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 6px;
        text-align: center;
        font-size: 12px;
        color: #5c6672;
        letter-spacing: 0.06em;
        pointer-events: none;
        line-height: 1.5;
      }
      #foot b {
        color: #8b95a3;
        font-weight: 600;
      }
      #foot a {
        color: #7fa0c6;
        text-decoration: none;
        pointer-events: auto;
      }
      #foot .hint {
        color: #4c5560;
        font-style: italic;
        margin-left: 4px;
      }
    </style>
  </head>
